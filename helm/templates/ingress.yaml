---
{{- $appName := include "app.name" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  #name: task-mgr-ingress
  name: {{ $appName }}-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    # traefik.ingress.kubernetes.io/router.middlewares: task-mgr-strip-task-mgr-api@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: {{ $appName }}-strip-{{ $appName }}-api@kubernetescrd
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $appName }}-service
                port:
                  number: 80
